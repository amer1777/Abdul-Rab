<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="سجل طلب تفصيل طاولتك مع مصنع تفصيل طاولات."><title>تسجيل طلب | مصنع تفصيل طاولات</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>مصنع تفصيل <b>طاولات</b></span></a><a class="text-link" href="index.html">العودة للرئيسية</a></div></header><main class="form-page"><div class="form-card"><p class="eyebrow"><span></span> ابدأ مشروعك</p><h1>سجّل طلب <em>تفصيل طاولتك</em></h1><p>املأ البيانات التالية وسيفتح لك واتساب برسالة جاهزة بالمعلومات التي أدخلتها.</p><form onsubmit="sendOrder(event)"><label>الاسم الكامل<input id="name" required placeholder="اكتب اسمك"></label><label>نوع الطاولة<select id="type"><option>طاولة طعام</option><option>طاولة مجلس</option><option>طاولة مكتب</option><option>تصميم خاص</option></select></label><div class="form-row"><label>الطول بالسنتيمتر<input id="length" type="number" placeholder="مثال: 200"></label><label>العرض بالسنتيمتر<input id="width" type="number" placeholder="مثال: 100"></label></div><label>ملاحظاتك<textarea id="notes" rows="4" placeholder="الخامة، اللون، الكمية أو أي تفاصيل إضافية"></textarea></label><button class="button button-gold" type="submit">إرسال الطلب عبر واتساب <span>←</span></button></form></div></main><script>function sendOrder(e){e.preventDefault();const q='مرحباً، أرغب بتسجيل طلب تفصيل طاولة.%0Aالاسم: '+encodeURIComponent(name.value)+'%0Aالنوع: '+encodeURIComponent(type.value)+'%0Aالمقاس: '+encodeURIComponent(length.value||'غير محدد')+' × '+encodeURIComponent(width.value||'غير محدد')+' سم%0Aالملاحظات: '+encodeURIComponent(notes.value||'لا يوجد');window.open('https://wa.me/966532059243?text='+q,'_blank')}</script></body></html>
